# Publishes a release from a build that has already been tested: the exact files of a successful `build` run (package,
# AnvilMac manifest, corresponding source archive, SHA256SUMS), verified again, tagged on the commit that run built.
# Nothing is rebuilt, so what was tested is what's released. Started by hand only. Free: a standard Linux runner, no
# build. Before it runs, `releases/<version>.json` (the tested facts: testedMacOS, graphics statuses) and
# `releases/<version>.md` (what's new, known problems; shown in AnvilMac) are committed to main. The job builds the
# release manifest from them and signs it with the RUNTIME_SIGNING_KEY secret (Ed25519); AnvilMac lists and installs
# a runtime from GitHub only when that signature checks out with the public key built into the app.
name: release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of the successful build run to release (it must have been tested)'
        required: true
      tag:
        description: 'Release tag, e.g. runtime-wine-11.19-1'
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # create the tag and the release
      actions: read     # download the build run's artifact
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the build run and the tag
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id must be a number"; exit 1; }
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "tag may contain only letters, digits, . _ -"; exit 1; }
          gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json workflowName,status,conclusion,headSha > run.json
          jq -e '.workflowName == "build" and .status == "completed" and .conclusion == "success"' run.json \
            || { echo "run $RUN_ID is not a successful build run"; cat run.json; exit 1; }
          echo "SHA=$(jq -r .headSha run.json)" >> "$GITHUB_ENV"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "release $TAG already exists"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - name: Download and verify the tested artifact
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "anvilmac-runtime-$SHA" -D dist
          cd dist && sha256sum -c SHA256SUMS && ls -la
      - name: Tested facts and notes for this release (releases/<version>.json and .md on main, written after testing)
        run: |
          set -euo pipefail
          source inputs.sh
          VERSION="$WINE_VERSION-$RUNTIME_RELEASE"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git fetch --depth=1 origin main
          git show "origin/main:releases/$VERSION.json" > tested.json \
            || { echo "releases/$VERSION.json is missing on main: record the tested facts first"; exit 1; }
          git show "origin/main:releases/$VERSION.md" > whatsnew.md \
            || { echo "releases/$VERSION.md is missing on main: write the release notes first"; exit 1; }
      - name: Signed release manifest (AnvilMac installs a runtime listed on GitHub only with a valid signature)
        env:
          SIGNING_KEY: ${{ secrets.RUNTIME_SIGNING_KEY }}
          # The public half built into AnvilMac (AnvilCore RuntimeSignature.publicKey); a different secret stops the release.
          EXPECTED_PUBLIC_KEY: NuZy7gCpE5Km105x26P/u+MqNqX5z57E4/23ncfqb/4=
        run: |
          set -euo pipefail
          PKG="$(basename dist/*.tar.xz .tar.xz)"
          python3 - "$PKG" "$TAG" "$VERSION" "$GITHUB_REPOSITORY" <<'PY'
          import hashlib, json, os, sys
          pkg, tag, version, repo = sys.argv[1:5]
          m = json.load(open(f"dist/{pkg}.manifest.json"))
          tested = json.load(open("tested.json"))
          tarball = f"dist/{pkg}.tar.xz"
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          m["displayName"] = m["displayName"].replace(" (experimental, CI build)", "")
          m.update(experimental=False, localOnly=False, role="main", version=version)
          m["source"].update(url=base + f"{pkg}.tar.xz", sha256=hashlib.sha256(open(tarball, "rb").read()).hexdigest(),
                             size=os.path.getsize(tarball), sourceCode=base + f"sources-{pkg}.tar")
          if "license" in tested: m["source"]["license"] = tested["license"]
          assert tested.get("testedMacOS"), "tested.json: testedMacOS is required"
          m["host"]["testedMacOS"] = tested["testedMacOS"]
          backends = {g["id"]: g for g in m["graphics"]}
          for gid, facts in tested.get("graphics", {}).items():
              assert gid in backends, f"tested.json: unknown graphics backend {gid}"
              assert set(facts) <= {"status", "evidence"}, f"tested.json: {gid} may set only status and evidence"
              assert facts.get("status", "untested") in {"tested", "untested", "broken", "absent"}, f"{gid}: bad status"
              backends[gid].update(facts)
          open(f"dist/{pkg}.release.json", "w").write(json.dumps(m, indent=2, sort_keys=True) + "\n")
          PY
          cat "dist/$PKG.release.json"
          umask 077
          KEY="$RUNNER_TEMP/runtime-signing.pem"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$KEY"
          GOT="$(openssl pkey -in "$KEY" -pubout -outform DER | tail -c 32 | base64)"
          [ "$GOT" = "$EXPECTED_PUBLIC_KEY" ] || { echo "the signing secret doesn't match AnvilMac's public key"; exit 1; }
          openssl pkeyutl -sign -inkey "$KEY" -rawin -in "dist/$PKG.release.json" -out "dist/$PKG.release.json.sig"
          openssl pkey -in "$KEY" -pubout -out "$RUNNER_TEMP/runtime-signing.pub"
          rm -f "$KEY"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/runtime-signing.pub" -rawin -in "dist/$PKG.release.json" \
            -sigfile "dist/$PKG.release.json.sig"
          ls -la dist
      - name: Release notes from the repository at that commit
        run: |
          set -euo pipefail
          source inputs.sh
          # A DXMT release is named by its tag; a pinned commit on a branch by the commit (11.19-16: main at 647b002).
          DXMT_NAME="$DXMT_TAG"; [ "$DXMT_TAG" != main ] || DXMT_NAME="main at ${DXMT_COMMIT:0:7}"
          {
            cat whatsnew.md
            echo
            echo "---"
            echo
            echo "AnvilMac runtime: Wine $WINE_VERSION + DXMT $DXMT_NAME, x86_64 (Apple silicon through Rosetta 2)."
            echo
            echo "Built from pinned, checksum-verified sources by build run $RUN_ID (commit $SHA); these are that run's exact files."
            echo "Independent project: not affiliated with or endorsed by WineHQ, CodeWeavers, Apple or the DXMT project."
            echo
            echo "## Patches"
            echo
            echo "Wine (\`patches/wine\`, LGPL-2.1-or-later):"
            grep -v '^#' patches/wine/series | while read -r p; do [ -n "$p" ] && echo "- $(sed -n 's/^Subject: \(\[PATCH\] \)\{0,1\}//p' "patches/wine/$p" | head -1) (\`$p\`)"; done
            echo
            echo "DXMT (\`patches/dxmt\`):"
            grep -v '^#' patches/dxmt/series | while read -r p; do [ -n "$p" ] && echo "- \`$p\`"; done
            echo
            echo "## Inputs"
            echo
            echo "- Wine $WINE_VERSION; DXMT $DXMT_NAME; MoltenVK $MOLTENVK_VERSION; Khronos Vulkan loader $VULKAN_LOADER_TAG; Wine Mono $WINE_MONO_VERSION; FreeType 2.13.3."
            echo "- Every input and its checksum: \`inputs.sh\` at $SHA."
            echo
            echo "## Files"
            echo
            echo "- the runtime package (\`.tar.xz\`, with \`SHA256SUMS\` of every file inside);"
            echo "- its AnvilMac runtime manifest (\`.manifest.json\`), and the signed one AnvilMac installs from (\`.release.json\` and \`.release.json.sig\`, Ed25519);"
            echo "- \`sources-….tar\`: the complete corresponding source (LGPL): the exact source tarballs, every patch, the build scripts;"
            echo "- \`SHA256SUMS\` of the package, the build manifest and the source archive."
          } > notes.md
          cat notes.md
      - name: Create the release
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.tar.xz dist/*.manifest.json dist/*.release.json dist/*.release.json.sig \
            dist/sources-*.tar dist/SHA256SUMS \
            -R "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --notes-file notes.md
